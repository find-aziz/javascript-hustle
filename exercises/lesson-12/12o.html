  <body>
    <script>
      function removeEgg(foods) {
        let eggs = 0;
        const eggRemoved = foods.filter((item) => {
          if (item === "egg" && eggs < 2) {
            eggs++;
          } else {
            return item;
          }
          //   return item !== "egg" && eggs > 0;
        });
        return console.log(eggRemoved);
      }
      removeEgg(["egg", "apple", "egg", "egg", "orange"]);
    </script>
