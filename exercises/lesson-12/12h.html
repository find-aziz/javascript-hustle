<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
  </head>
  <body>
    <button onclick="add()">Add</button>
    <button onclick="remove()">Remove</button>
    <script>
      let message = 2;

      function add() {
        message++;
      }
      function remove() {
        message--;
      }
      setInterval(function () {
        if (document.title === "App") {
          document.title = `(${message}) New Messages`;
        } else if (document.title === `(${message}) New Messages`) {
          document.title = "App";
        }
      }, 1000);
    </script>
  </body>
</html>
