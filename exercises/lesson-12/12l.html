  <body>
    <script>
      function countPostive(nums) {
        let positiveNumbers = 0;
        nums.forEach((value) => {
          if (value > 0) {
            positiveNumbers++;
          }
        });
        return console.log(positiveNumbers);
      }
      countPostive([1, -3, 5]);
      countPostive([-2, 3, -5, 7, 10]);
    </script>
  </body>
