<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lesson 12f</title>
  </head>
  <body>
    <button class="js-button" onclick="changeOnclick()">Add to cart</button>
    <p class="js-paragraph"></p>
    <script>
      let intervelId; // to store interval id
      function changeOnclick() {
        const buttonElement = document.querySelector(".js-paragraph");
        buttonElement.innerHTML = "Added";
        clearInterval(intervelId); // clear the previous interval id
        intervelId = setTimeout(function () {
          //re asign the interval id to the variable.
          buttonElement.innerHTML = "";
        }, 2000);
      }
    </script>
  </body>
</html>
