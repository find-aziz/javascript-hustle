<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>lesson 12m</title>
  </head>
  <body>
    <script>
      function addNum(array, num) {
        const increasedNum = array.map((item, index) => item + num);
        return console.log(increasedNum);
      }
      addNum([1, 2, 3], 2);
      addNum([-2, -1, 0, 99], 2);
    </script>
  </body>
