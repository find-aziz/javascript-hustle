<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced functions</title>
  </head>
  <body>
    <button class="js-button">Click</button>
    <script>
      const buttonElement = document.querySelector(".js-button");
      // Every html element has a method called Event Listener.
      // .addEventListerner() let us run some code when we intereact with the element.
      // has two parameters 1. event 2. A function we want to run.
      // 1. Let us have multiple eventListener for an event
      // 2. we can remove and eventListener using a method called .removeEventListener();
      const eventListener = () => {
        console.log("Clicked");
      };
      buttonElement.addEventListener("click", eventListener);
      buttonElement.removeEventListener('click',eventListener);
      buttonElement.addEventListener("click", () => {
        console.log("Clicked 2");
      });
      // Best Practice use eventListerner instead of onclick attribute.
    </script>
    <script>
      // Normal Function
      greetings();
      // this function comes with hoisting means we can use it before the declaration.
      function greetings() {
        console.log("Hello");
      }
      //   function call
      greetings();
      // There is another syntax for creating a function that is called a Function Expression.
      // Functions are special kind of value.
      // There is another syntax for creating a function that is called a Function Expression. It allows us to create a new function in the middle of any expression.
      // We can save a function inside a variable.
      const function1 = function () {
        // this is called an anonymous function.
        console.log("hello again");
      }; //note: semi colon at the end because we are using variable.
      console.log(function1);
      console.log(typeof function1);
      function1();
      //   we can save a function inside the object
      const object1 = {
        num: 2,
        fun: function () {
          console.log("Function save inside an Object is called method");
        },
      };
      object1.fun();
      // passing a value inside a function using params.
      function display(params) {
        console.log(params);
      }
      display(2);
      //   Since functions are also value we can also pass function as a parameter.
      function run(param) {
        param();
      }
      run(function () {
        console.log("keep running");
      }); // This is call passing a function into another function which are called as callback functions.
    </script>
    <script>
      // setTimeout() allow us to run a function in the future.
      setTimeout(function () {
        console.log("Timeout");
        //code inside this function is synchornous
        console.log("Timeout again");
      }, 3000); // after 3 sec the function will be called.
      // setTimeout take two params first is function and second how long to wait before running this function.
      console.log("next line");
      //   when setTimeout() is called it sets a timer and goes to the next line rather wait for the timer to complete
      // this is called asynchornous code = computer won't wait for a line to finish before going on to the next line
      // synchornous code = computer will wait for a line to finish before going on to the next line
      // Advantages of Asynchornous is that it does not block code for 3 seconds.
      // setInterval() allow us to keep running a function in the future again and again after at specific intervals.
      setInterval(function () {
        console.log("Interval");
      }, 3000);
      console.log("another next line");
      // this code will run without being interupted by both the asynchornous functions.
    </script>
    <script>
      ["make dinner", "wash dinner", "do cleaning", "watch youtube"].forEach(
        function (value, index) {
          console.log(value);
          console.log(index);
        }
      );
      // Continue statement inside forEach using return keyword
      ["make dinner", "wash dinner", "do cleaning", "watch youtube"].forEach(
        function (value, index) {
          if (value === "wash dinner") {
            return;
          }
          console.log(value);
          console.log(index);
        }
      );
    </script>
    <script>
      // Arrow Function: concise syntax for creating functions, that’s often better than Function Expressions.
      const regularExpFunction = function (param1, param2) {
        console.log("regular expression function");
        return 5;
      };
      const arrowFunction = (param1, param2) => {
        console.log("Hello");
        return 5;
      };
      arrowFunction();
      // ShortCuts of Arrow functions different from regular functions
      const oneParam = (param) => {
        console.log(param + 1);
      };
      const oneLine = () => 2 + 3;
      // Practice using arrow functions
      ["make dinner", "wash dinner", "do cleaning", "watch youtube"].forEach(
        (value, index) => {
          console.log(value);
          console.log(index);
        }
      );
      // When passing a function into another function it is recommended to use arrow function.
      // another place where we could use arrow function which is inside an object.
      const object2 = {
        method: () => {}, // using arrow functions
        method() {},//even shorter syntax for creating method : shorthand method
      };
    </script>
    <script>
      //More array method .filter() and .map()
      console.log(
        [1, -3, 5].filter((value, index) => {
          /*
          if (value >= 0) {
            return true;
          } else {
            return false;
          }
            */
          return value >= 0;
        })
      );
      console.log(
        [1, 1, 3].map((value, index) => {
          return value * 2;
        })
      );
      console.log([1, 1, 3].map((value) => value * 2));
      // Feature of function clousure.
      // if a function has access to a value, it will always have access to that value
    </script>
  </body>
</html>
